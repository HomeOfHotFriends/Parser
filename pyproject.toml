[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-token-pipeline"
version = "0.1.0"
description = "SVG → token compiler pipeline (Phase 1: PARSE → IR → EMIT)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
